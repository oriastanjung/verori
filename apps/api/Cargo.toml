[package]
name = "api"
version = "0.1.0"
edition = "2021"
default-run = "api"

[lib]
name = "api"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[dependencies]
axum.workspace = true
tokio.workspace = true
sea-orm.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true
dotenvy.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-scalar.workspace = true
chrono.workspace = true
auth = { path = "../../packages/auth" }
transactional = { path = "../../packages/transactional" }
better-auth.workspace = true
tower-http = { workspace = true, features = ["cors", "set-header", "timeout"] }
tower_governor.workspace = true
governor = "0.10"
db = { path = "../../packages/db" }
queue = { path = "../../packages/queue" }
logging = { path = "../../packages/logging" }
