services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    network_mode: host
    env_file: apps/api/.env

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    network_mode: host
    env_file: apps/worker/.env

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    network_mode: host
    env_file: apps/web/.env
    depends_on:
      - api
