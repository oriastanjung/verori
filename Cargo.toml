[workspace]
resolver = "2"

members = [
    "apps/api",
    "apps/worker",
    "packages/db",
    "packages/db/migration",
    "packages/auth",
    "packages/queue",
    "packages/transactional",
    "packages/logging"
]

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
sea-orm = { version = "2.0.2", features=["sqlx-postgres", "runtime-tokio-rustls", "macros"]}
sea-orm-migration = "2.0.2"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
async-trait = "0.1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
tokio-util = "0.7"
tower-http = "0.6"
futures = "0.3"
better-auth = { version = "1.0.0-alpha.2", default-features = false, features = ["axum", "seaorm2", "rustls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
